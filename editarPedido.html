<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisar Pedido | FF Studio</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="icon" type="image/png" href="/images/Logo_FFStudio_2.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/style.css">
    <script type="module" src="/javascript/pageFunctions/authGuard.js"></script>
</head>

<body class="bg-[#FDF8F3] min-h-screen text-gray-800">

    <!-- Navegação -->
    <nav class="bg-white shadow-sm border-b border-orange-100">
        <div class="max-w-7xl mx-auto px-4 py-5 flex justify-between items-center">
            <a href="index.html" class="flex items-center">
                <img src="/images/Logo_FFStudio.png" alt="Logo FF Studio" class="h-10 w-auto">
            </a>
            <button type="button" onclick="window.location.href='gerenciaPedidos.html'" class="border border-coral text-coral px-5 py-2 rounded-full hover:bg-coral hover:text-white transition flex items-center gap-2">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Voltar
            </button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-16">

        <div class="mb-10 text-center">
            <p class="text-coral font-medium tracking-widest uppercase mb-4 text-sm">Painel Administrativo</p>
            <h1 class="text-4xl lg:text-5xl font-bold text-gray-800">
                Revisar pedido
            </h1>
            <p id="order-subtitle" class="text-gray-500 mt-2 text-sm"></p>
        </div>

        <form id="order-form" class="space-y-8">

            <!-- Dados do Cliente e Status -->
            <div class="bg-white rounded-3xl shadow-lg p-8">
                <h2 class="text-xl font-bold text-gray-800 mb-6">Detalhes do Atendimento</h2>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label for="customer_name" class="block text-sm font-bold text-gray-700 mb-2">Nome do Cliente</label>
                        <input type="text" id="customer_name" name="customer_name" placeholder="Ex.: Maria Clara"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-coral focus:border-transparent transition-all">
                    </div>

                    <div>
                        <label for="customer_phone" class="block text-sm font-bold text-gray-700 mb-2">WhatsApp / Telefone</label>
                        <input type="text" id="customer_phone" name="customer_phone" placeholder="Ex.: (14) 99999-9999"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-coral focus:border-transparent transition-all">
                    </div>

                    <div>
                        <label for="status" class="block text-sm font-bold text-gray-700 mb-2">Status do Pedido</label>
                        <select id="status" name="status"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-coral focus:border-transparent transition-all bg-white">
                            <option value="pending">Pendente (Prévia)</option>
                            <option value="confirmed">Confirmado</option>
                            <option value="cancelled">Cancelado</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                    <div>
                        <label for="payment_method" class="block text-sm font-bold text-gray-700 mb-2">Forma de Pagamento</label>
                        <select id="payment_method" name="payment_method"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-coral focus:border-transparent transition-all bg-white">
                            <option value="">A combinar / Não informado</option>
                            <option value="Pix">Pix</option>
                            <option value="Cartão de crédito">Cartão de crédito</option>
                            <option value="Cartão de débito">Cartão de débito</option>
                            <option value="Dinheiro">Dinheiro</option>
                            <option value="Transferência bancária">Transferência bancária</option>
                        </select>
                    </div>

                    <div>
                        <label for="notes" class="block text-sm font-bold text-gray-700 mb-2">Observações / Personalização / Entrega</label>
                        <input type="text" id="notes" name="notes" placeholder="Ex.: Cor terracota, entregar sábado à tarde"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-coral focus:border-transparent transition-all">
                    </div>
                </div>
            </div>

            <!-- Itens do Pedido -->
            <div class="bg-white rounded-3xl shadow-lg p-8">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <h2 class="text-xl font-bold text-gray-800">Itens do Pedido</h2>

                    <!-- Adicionar Novo Produto -->
                    <div class="flex flex-col sm:flex-row gap-2">
                        <select id="add-product-select"
                            class="px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-coral bg-white text-sm">
                            <option value="">Adicionar peça do catálogo...</option>
                        </select>
                        <button type="button" id="add-product-btn"
                            class="bg-coral text-white px-4 py-2.5 rounded-xl text-sm font-semibold hover:opacity-90 transition flex items-center justify-center gap-1">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            Adicionar
                        </button>
                    </div>
                </div>

                <div id="order-items-list" class="space-y-4">
                </div>

                <div class="mt-8 pt-6 border-t border-gray-100 flex justify-between items-center">
                    <span class="text-lg font-bold text-gray-700">Total do Pedido</span>
                    <span id="order-total-display" class="text-3xl font-bold text-coral">R$ 0,00</span>
                </div>
            </div>

            <!-- Ações -->
            <div class="flex gap-4">
                <a href="gerenciaPedidos.html" class="w-1/3 text-center bg-gray-100 text-gray-700 px-6 py-4 rounded-full font-medium hover:bg-gray-200 transition">
                    Cancelar
                </a>

                <button type="submit"
                    class="w-2/3 bg-green text-white px-6 py-4 rounded-full font-medium hover:opacity-90 transition btn-hover flex justify-center items-center gap-2">
                    <i data-lucide="save" class="w-5 h-5"></i>
                    Salvar Alterações do Pedido
                </button>
            </div>

        </form>

    </main>

    <script>
        lucide.createIcons();
    </script>

    <div id="footer-container"></div>

    <script type="module" src="/javascript/pageFunctions/editarPedido.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo | FF Studio</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="icon" type="image/png" href="/images/Logo_FFStudio_2.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/style.css">
</head>

<body class="bg-[#FDF8F3] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-xl max-w-md w-full p-8 lg:p-10 border border-orange-100">
        
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block mb-4">
                <img src="/images/Logo_FFStudio.png" alt="Logo FF Studio" class="h-12 w-auto mx-auto">
            </a>
            <h1 class="text-2xl font-bold text-gray-800">Acesso Restrito</h1>
            <p class="text-sm text-gray-500 mt-1">Painel de gerenciamento do e-commerce</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-bold text-gray-700 mb-2">E-mail</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-coral transition-all"
                    placeholder="admin@ffstudio.com.br">
            </div>

            <div>
                <label for="password" class="block text-sm font-bold text-gray-700 mb-2">Senha</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-coral transition-all"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full bg-coral text-white py-4 rounded-full font-bold hover:opacity-90 transition btn-hover flex items-center justify-center gap-2">
                <i data-lucide="lock" class="w-4 h-4"></i>
                Entrar no Painel
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm text-gray-500 hover:text-coral transition-colors">
                ← Voltar para a loja
            </a>
        </div>
    </div>

    <script>lucide.createIcons();</script>
    <script type="module" src="/javascript/pageFunctions/login.js"></script>
</body>
</html>
